name: Finalize AniToon scanner and web
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply final requested behavior
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          root=Path('.')
          botp=root/'bot.py'; fip=root/'file_inspector.py'; mpp=root/'media_probe.py'
          bot=botp.read_text(); fi=fip.read_text(); mp=mpp.read_text()

          # Keep every source-processing path strictly below 5 MB.
          fi=fi.replace('MAX_SAFE_SOURCE_BYTES = 4_999_000','MAX_SAFE_SOURCE_BYTES = 4_999_000')
          mp=mp.replace('MAX_SAFE_SOURCE_BYTES = 4_999_000','MAX_SAFE_SOURCE_BYTES = 4_999_000')

          # Effective player defaults.
          old='''    if track.get("type") == "audio":
              audio_tracks = report.audio.get("tracks", [])
              if audio_tracks and not any(x.get("default") == "yes" for x in audio_tracks):
                  first = audio_tracks[0]
                  if first.get("default") in (None, ""):
                      first["default"] = "yes"
'''
          new=old+'''    elif track.get("type") == "subtitle":
              for item in report.subtitles:
                  item["default"] = "yes"
              track["default"] = "yes"
          elif track.get("type") == "video":
              video_tracks = report.video.get("tracks", [])
              if len(video_tracks) > 1:
                  if not any(x.get("default") == "yes" for x in video_tracks):
                      video_tracks[0]["default"] = "yes"
                  for item in video_tracks[1:]:
                      if item.get("default") in (None, ""):
                          item["default"] = "no"
'''
          if old in fi and 'elif track.get("type") == "subtitle"' not in fi:
              fi=fi.replace(old,new,1)

          # PDF useful metadata.
          marker='''def _generic(data:bytes,kind:str,report:Report):
'''
          pdf='''def _generic(data:bytes,kind:str,report:Report):
              if kind=="pdf":
                  report.container["format"]="PDF"
                  if data.startswith(b"%PDF-"):
                      report.container["pdf_version"]=data[5:8].decode("ascii","replace")
                  pages=len(re.findall(rb"/Type\\s*/Page\\b",data))
                  if pages:
                      report.container["pages"]=str(pages)
                  title_match=re.search(rb"/Title\\s*\\(([^)]{1,240})\\)",data)
                  if title_match:
                      title=title_match.group(1).decode("latin1","replace").strip()
                      if title:
                          report.container["title"]=title
                  return
'''
          if marker in fi and 'report.container["pdf_version"]' not in fi:
              fi=fi.replace(marker,pdf+'\n'+marker,1)

          # Smooth 0→100 animation without a heavy worker.
          bot=bot.replace('await asyncio.sleep(0.9)','await asyncio.sleep(0.45)',1)
          bot=bot.replace('visual_pct = min(76, current + 5)','visual_pct = min(76, current + 2)',1)
          bot=bot.replace('visual_pct = min(98, current + 5)','visual_pct = min(98, current + 2)',1)

          # Remove parser-only fields from user web cards.
          bot=bot.replace('''                ("Codec delay", track.get("codec_delay")),
                  ("Seek preroll", track.get("seek_preroll")),
                  ("Format", track.get("subtitle_format") or track.get("format")),
''','''                ("Format", track.get("subtitle_format") or track.get("format")),
''',1)
          bot=bot.replace('''"commentary","hearing_impaired","visual_impaired","stereo_mode","codec_delay",
                "seek_preroll","subtitle_format","format"''','''"commentary","hearing_impaired","visual_impaired","stereo_mode","subtitle_format","format"''',1)

          # Artwork helper.
          helper='''\n\ndef _anitoon_art_data_uri() -> str:
              try:
                  p=os.path.join(os.path.dirname(__file__),"assets","anitoon_start.svg")
                  raw=open(p,"rb").read()
                  return "data:image/svg+xml;base64,"+base64.b64encode(raw).decode("ascii")
              except Exception:
                  return ""
'''
          if '_anitoon_art_data_uri()' not in bot:
              bot=bot.replace('\n\ndef home_page(report_token: str | None = None) -> bytes:',helper+'\n\ndef home_page(report_token: str | None = None) -> bytes:',1)

          # Channel cards get their own themed wallpaper treatment.
          card_old='''    def card(icon: str, name: str, url: str) -> str:
              return (
                  f'<a class="channel" href="{html.escape(url)}" target="_blank" rel="noopener noreferrer">'
                  f'<span class="channel-icon">{icon}</span>'
                  f'<span class="channel-name">{html.escape(name)}</span>'
                  f'<span class="channel-arrow">↗</span>'
                  f'</a>'
              )
'''
          card_new='''    def card(icon: str, name: str, url: str) -> str:
              hue={"Movies":350,"All Animes":285,"Dual Content":200,"Manga":315,"One Piece":35,"Jujutsu Kaisen":275,"Naruto Shippuden":215,"Doraemon":205,"Shin-Chan":20,"Beyblade":330,"Pokemon":55}.get(name,260)
              return (
                  f'<a class="channel channel-wallpaper" style="--channel-hue:{hue}" data-channel="{html.escape(name)}" href="{html.escape(url)}" target="_blank" rel="noopener noreferrer">'
                  f'<span class="channel-icon">{icon}</span>'
                  f'<span class="channel-name">{html.escape(name)}</span>'
                  f'<span class="channel-arrow">↗</span>'
                  f'</a>'
              )
'''
          if card_old in bot:
              bot=bot.replace(card_old,card_new,1)

          # Start page artwork.
          bot=bot.replace('''  <header class="hero">
    <span class="eyebrow"><span class="dot"></span> Media intelligence</span>
''','''  <header class="hero start-hero">
    <div class="start-art"><img src="{_anitoon_art_data_uri()}" alt="AniToon @anitoon_1bot"></div>
    <span class="eyebrow"><span class="dot"></span> Media intelligence</span>
''',1)

          css_marker='''@keyframes wallpaperZoom{{from{{transform:scale(1.03)}}to{{transform:scale(1.08)}}}}'''
          extra='''.start-art{{max-width:760px;margin:0 auto 20px;border-radius:22px;overflow:hidden;border:1px solid rgba(255,255,255,.12);box-shadow:0 0 55px rgba(255,32,63,.16);animation:artFloat 5s ease-in-out infinite}}.start-art img{{display:block;width:100%;height:auto}}.channel-wallpaper{{position:relative;overflow:hidden;isolation:isolate;background:linear-gradient(135deg,hsla(var(--channel-hue),90%,58%,.12),rgba(255,255,255,.02))}}.channel-wallpaper::before{{content:attr(data-channel);position:absolute;right:-12px;bottom:-12px;font-size:34px;font-weight:1000;letter-spacing:.06em;color:hsla(var(--channel-hue),95%,72%,.10);transform:rotate(-6deg);pointer-events:none;z-index:-1}}.channel-wallpaper::after{{content:"";position:absolute;inset:-50%;background:radial-gradient(circle,hsla(var(--channel-hue),95%,65%,.20),transparent 58%);animation:channelPulse 6s ease-in-out infinite;pointer-events:none;z-index:-2}}@keyframes artFloat{{0%,100%{{transform:translateY(0)}}50%{{transform:translateY(-4px)}}}}@keyframes channelPulse{{0%,100%{{transform:scale(.92);opacity:.45}}50%{{transform:scale(1.08);opacity:.9}}}}'''
          if '.start-art{{' not in bot:
              bot=bot.replace(css_marker,extra+css_marker,1)

          # No-thumbnail reports still get exactly one image, in the existing hero slot.
          marker='''    previews = list(getattr(report, "previews", []) or [])[:1]

    report_id = esc((report_token or "local")[:14])
'''
          repl='''    previews = list(getattr(report, "previews", []) or [])[:1]
    hero_src = (
        "data:image/jpeg;base64," + str(previews[0].get("data") or "")
        if previews and previews[0].get("data")
        else _anitoon_art_data_uri()
    )
    hero_alt = "Telegram thumbnail" if previews and previews[0].get("data") else "AniToon media artwork"

    report_id = esc((report_token or "local")[:14])
'''
          if marker in bot and 'hero_src =' not in bot:
              bot=bot.replace(marker,repl,1)
          oldhero='''{f'<div class="hero-media" id="hero-media"><img src="data:image/jpeg;base64,{str(previews[0].get("data") or "")}" alt="Telegram thumbnail" loading="eager"><span class="media-label">🎞️ Telegram thumbnail</span></div>' if previews and previews[0].get("data") else ''}'''
          newhero='''{f'<div class="hero-media" id="hero-media"><img src="{hero_src}" alt="{hero_alt}" loading="eager"><span class="media-label">🎞️ Telegram thumbnail</span></div>' if hero_src else ''}'''
          if oldhero in bot:
              bot=bot.replace(oldhero,newhero,1)

          # Cap the user-facing lists at the requested 100.
          bot=bot.replace('audio = list(report.audio.get("tracks", []) or [])','audio = list(report.audio.get("tracks", []) or [])[:MAX_REPORT_TRACKS]',1)
          bot=bot.replace('video = list(report.video.get("tracks", []) or [])','video = list(report.video.get("tracks", []) or [])[:MAX_REPORT_TRACKS]',1)
          bot=bot.replace('subtitles = list(report.subtitles or [])','subtitles = list(report.subtitles or [])[:MAX_REPORT_TRACKS]',1)

          # Replace the malformed earlier asset with the valid SVG asset.
          bad=root/'assets'/'anitoon_start.jpg.b64'
          if bad.exists(): bad.unlink()
          assets=root/'assets'; assets.mkdir(exist_ok=True)
          svg_text="<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1600 900\"><defs><radialGradient id=\"b\"><stop stop-color=\"#3b0710\"/><stop offset=\".55\" stop-color=\"#16030a\"/><stop offset=\"1\" stop-color=\"#030207\"/></radialGradient><linearGradient id=\"r\" x1=\"0\" x2=\"1\"><stop stop-color=\"#ff1838\"/><stop offset=\".5\" stop-color=\"#ff4b2f\"/><stop offset=\"1\" stop-color=\"#ff0b69\"/></linearGradient><linearGradient id=\"s\"><stop stop-color=\"#fff\"/><stop offset=\".5\" stop-color=\"#cbd7ff\"/><stop offset=\"1\" stop-color=\"#7483b6\"/></linearGradient></defs><rect width=\"1600\" height=\"900\" fill=\"url(#b)\"/><g fill=\"none\" stroke=\"url(#r)\" opacity=\".65\"><path d=\"M40 190C300 10 430 350 680 120S1120 20 1560 250\" stroke-width=\"8\"/><path d=\"M0 760C330 550 450 850 790 610S1250 470 1600 700\" stroke-width=\"5\"/><circle cx=\"800\" cy=\"450\" r=\"360\" stroke-width=\"4\" stroke-dasharray=\"18 20\"/><circle cx=\"800\" cy=\"450\" r=\"285\" stroke-width=\"2\" stroke-dasharray=\"8 18\"/></g><g fill=\"none\" stroke=\"#ff4050\" stroke-width=\"7\"><rect x=\"95\" y=\"250\" width=\"190\" height=\"125\" rx=\"22\"/><path d=\"M170 285l75 43-75 43z\" fill=\"#fff\" stroke=\"none\"/><rect x=\"1300\" y=\"255\" width=\"190\" height=\"125\" rx=\"22\"/><path d=\"M1370 285l75 43-75 43z\" fill=\"#fff\" stroke=\"none\"/></g><g transform=\"translate(800 385)\"><circle cx=\"0\" cy=\"-150\" r=\"105\" fill=\"url(#s)\" stroke=\"#eaf0ff\" stroke-width=\"6\"/><rect x=\"-82\" y=\"-195\" width=\"164\" height=\"105\" rx=\"44\" fill=\"#050711\" stroke=\"#8ea6e8\" stroke-width=\"6\"/><path d=\"M-40-145q18-26 36 0q18-26 36 0\" fill=\"none\" stroke=\"#28b8ff\" stroke-width=\"11\" stroke-linecap=\"round\"/><circle cx=\"0\" cy=\"-275\" r=\"25\" fill=\"#52e8ff\" stroke=\"#fff\" stroke-width=\"5\"/><path d=\"M0-250V-215\" stroke=\"#eaf0ff\" stroke-width=\"9\"/><rect x=\"-145\" y=\"-55\" width=\"290\" height=\"275\" rx=\"95\" fill=\"url(#s)\" stroke=\"#eaf0ff\" stroke-width=\"7\"/><rect x=\"-105\" y=\"-10\" width=\"210\" height=\"150\" rx=\"24\" fill=\"#0a0c16\" stroke=\"#aebdf0\" stroke-width=\"5\"/><path d=\"M-55 35h110M-55 70h110M-55 105h75\" stroke=\"#fff\" stroke-width=\"10\" stroke-linecap=\"round\"/><path d=\"M-40 145v70M40 145v70\" stroke=\"#d9e2ff\" stroke-width=\"32\" stroke-linecap=\"round\"/></g><text x=\"800\" y=\"690\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"150\" font-weight=\"900\" fill=\"url(#s)\" stroke=\"#050207\" stroke-width=\"18\" paint-order=\"stroke\">Ani</text><text x=\"1010\" y=\"690\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"150\" font-weight=\"900\" fill=\"url(#r)\" stroke=\"#050207\" stroke-width=\"18\" paint-order=\"stroke\">Toon</text><rect x=\"545\" y=\"735\" width=\"510\" height=\"78\" rx=\"39\" fill=\"#05060b\" stroke=\"url(#r)\" stroke-width=\"5\"/><text x=\"800\" y=\"792\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"42\" font-weight=\"800\" fill=\"#fff\">@anitoon_1bot</text></svg>"
          (assets/'anitoon_start.svg').write_text(svg_text,encoding='utf-8')

          botp.write_text(bot); fip.write_text(fi); mpp.write_text(mp)
          PY
          python -m py_compile bot.py file_inspector.py media_probe.py
          git config user.name "AniToon Automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot.py file_inspector.py media_probe.py assets/anitoon_start.svg
          git commit -m "Finalize AniToon scanner web and artwork"
          git push origin HEAD:main
