services:
  - type: web
    name: anitoons-1bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    autoDeployTrigger: commit
    healthCheckPath: /health
    envVars:
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: "gemini-3.5-flash-lite"
      - key: YOUTUBE_API_KEY
        sync: false
      - key: YOUTUBE_REGION_CODE
        value: "IN"
      - key: INTEL_WATCH_INTERVAL_HOURS
        value: "12"
      - key: FILE_CHECKER_PRIVATE_ONLY
        value: "0"
      - key: FILE_PROBE_BYTES
        value: "2097152"
      - key: FILE_DEEP_PROBE_BYTES
        value: "4194304"
      - key: FILE_PROBE_CHUNK_BYTES
        value: "131072"
      - key: MAX_CONCURRENT_CHECKS
        value: "1"
      - key: SCAN_TIMEOUT_SECONDS
        value: "90"
      - key: PUBLIC_WEB_URL
        value: "https://anitoons-1bot-oa44.onrender.com"
