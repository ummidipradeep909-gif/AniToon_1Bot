services:
  - type: web
    name: anitoons-1bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python file_bot.py
    envVars:
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: FILE_CHECKER_PRIVATE_ONLY
        value: "1"
      - key: FILE_PROBE_BYTES
        value: "2097152"
      - key: FILE_PROBE_CHUNK_BYTES
        value: "262144"
